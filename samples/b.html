<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Shippori+Mincho:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{overflow:hidden;font-family:"Zen Kaku Gothic New",sans-serif}a{color:inherit;text-decoration:none}
.btn{position:relative;overflow:hidden;display:inline-block;padding:16px 34px;border-radius:999px;font-weight:700;letter-spacing:.08em}
.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-22deg);animation:sh 3.5s infinite}
@keyframes sh{0%,50%{left:-60%}80%,100%{left:130%}}

body{background:#111;color:#fff}
.bg{position:absolute;inset:0;background:url(../assets/body.jpg) center/cover;animation:z 12s linear infinite alternate}
@keyframes z{to{transform:scale(1.12)}}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,25,20,.15),rgba(40,25,20,.55))}
.hd{position:relative;z-index:2;display:flex;justify-content:space-between;padding:28px 5vw;font-size:14px;letter-spacing:.2em}
.hd b{font-family:"Cormorant Garamond";font-size:28px;letter-spacing:.3em;font-weight:500}
.v{position:absolute;right:8vw;top:16vh;z-index:2;writing-mode:vertical-rl;font-family:"Shippori Mincho";font-size:58px;line-height:1.7;letter-spacing:.24em;text-shadow:0 2px 30px rgba(0,0,0,.3)}
.vs{position:absolute;z-index:2;right:calc(8vw + 230px);top:18vh;writing-mode:vertical-rl;font-size:15px;letter-spacing:.4em}.x{font-size:16px;letter-spacing:.4em;margin-top:30px;display:block}
.en{position:absolute;left:5vw;bottom:9vh;z-index:2;font-family:"Cormorant Garamond";font-style:italic;font-size:20px;letter-spacing:.2em}
.en b{display:block;font-size:110px;font-weight:400;letter-spacing:0;line-height:1}
.btn{position:absolute;z-index:2;right:8vw;bottom:9vh;border:1px solid #fff;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:0;font-weight:500}
</style></head><body><div class="bg"></div><div class="hd"><b>LUMIÈRE</b><span>CONCEPT　MENU　SALON　RESERVE</span></div>
<p class="v">ほどけていく、<br>わたしの時間</p><p class="vs">完全予約制 プライベートサロン</p>
<p class="en">Private Beauty Salon<b>Unwind.</b></p><a class="btn">ご予約はこちら　→</a></body></html>
