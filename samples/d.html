<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Shippori+Mincho:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{overflow:hidden;font-family:"Zen Kaku Gothic New",sans-serif}a{color:inherit;text-decoration:none}
.btn{position:relative;overflow:hidden;display:inline-block;padding:16px 34px;border-radius:999px;font-weight:700;letter-spacing:.08em}
.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-22deg);animation:sh 3.5s infinite}
@keyframes sh{0%,50%{left:-60%}80%,100%{left:130%}}

body{background:#f4ede6;color:#3d2e2a}
.hd{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw}
.logo{font-family:"Cormorant Garamond";font-size:28px;letter-spacing:.2em}.nav{display:flex;gap:26px;font-size:14px}
.grid{position:relative;display:grid;grid-template-columns:1.1fr .8fr 1fr;gap:16px;padding:0 5vw;height:calc(100vh - 230px)}
.grid div{border-radius:200px 200px 12px 12px;overflow:hidden}.grid div:nth-child(2){margin-top:60px;border-radius:12px}
.grid img{width:100%;height:100%;object-fit:cover}
.big{position:absolute;left:3vw;right:3vw;bottom:-6vh;font-family:"Playfair Display";font-weight:600;font-size:12.5vw;line-height:1;color:#fff;text-align:center;letter-spacing:.02em;mix-blend-mode:normal;text-shadow:0 10px 40px rgba(90,60,50,.25)}
.bt{display:flex;justify-content:space-between;align-items:center;padding:34px 5vw 0}
.bt h1{font-family:"Shippori Mincho";font-weight:500;font-size:34px;letter-spacing:.1em}
.bt .btn{background:#b88a5c;color:#fff}
</style></head><body><div class="hd"><span class="logo">LUMIÈRE beauté</span><nav class="nav"><span>CONCEPT</span><span>MENU</span><span>VOICE</span><span>RESERVE</span></nav></div>
<div class="grid"><div><img src="../assets/face.jpg"></div><div><img src="../assets/flowers.jpg"></div><div><img src="../assets/staff.jpg"></div><p class="big">BEAUTY TIME</p></div>
<div class="bt"><h1>肌と心を、ていねいに。</h1><a class="btn">初回限定 ¥5,500 で予約する →</a></div></body></html>
